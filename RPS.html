<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    
    <link href="RPS.css" rel="stylesheet">
</head>
<body>
    <p class="title">Rock Paper Scissor</p>
    <button onclick="
      playGame('rock');
        
    " class="move-button" ><img src="Images/Rock.png" class="move-icon"></button>

    <button onclick="
      playGame('paper');
    " class="move-button"><img src="Images/paper.png" class="move-icon"></button>

    <button onclick="
       playGame('scissors');
    
    " class="move-button"><img src="Images/scissors.png" class="move-icon"></button>

    <p class="js-result result"></p>

    <p class="js-moves"> </p>

    <p class="js-score score"></p>

    <button class="reset-score" onclick="
    score.wins=0;
    score.losses=0;
    score.ties=0;
    localStorage.removeItem('score');
    updateScoreElement();
    ">Reset Score</button>
    <script src="RPS.js">
        
    </script>
    
</body>
</html>
